[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "askround"
description = "Ask several AI assistants the same question and keep their answers side by side."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"  # tomllib reads the product files
authors = [{ name = "Alexandre Oliveira" }]
# askround has NO runtime dependencies, by design: every provider is one HTTPS POST
# through the standard library, which keeps the adapters symmetric and testable
# without a network.
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
askround = "askround.cli:main"

[tool.setuptools]
packages = ["askround"]

[tool.setuptools.dynamic]
version = { attr = "askround.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 100
# .claude/ holds roadkeep's installed hooks, refreshed by `roadkeep install`
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C4", "B"]

[tool.ruff.lint.per-file-ignores]
# the extraction instructions are prose a model reads: hard line breaks inside one
# instruction would change what it is told
"askround/extract.py" = ["E501"]
"askround/lookup.py" = ["E501"]
"askround/gaps.py" = ["E501"]
"askround/discover.py" = ["E501"]
# tool descriptions are prose an agent reads
"askround/mcp.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
