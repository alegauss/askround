[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "askround"
description = "See what ChatGPT, Gemini, Claude and Perplexity recommend: ask them all the same question with web search and read whether your product is named, where, beside which rivals, and what they claim about it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"  # tomllib reads the product files
authors = [{ name = "Alexandre Oliveira" }]
keywords = [
    "ai-visibility",
    "llm-visibility",
    "generative-engine-optimization",
    "chatgpt",
    "gemini",
    "claude",
    "perplexity",
    "mcp",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities",
]
# askround has NO runtime dependencies, by design: every provider is one HTTPS POST
# through the standard library, which keeps the adapters symmetric and testable
# without a network.
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/alegauss/askround"
Repository = "https://github.com/alegauss/askround"
Issues = "https://github.com/alegauss/askround/issues"
Changelog = "https://github.com/alegauss/askround/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
askround = "askround.cli:main"

[tool.setuptools]
# the package lives inside the plugin, so the marketplace copy carries it and the plugin
# runs with nothing installed (AR38)
package-dir = { "" = "plugin/src" }
packages = ["askround"]

[tool.setuptools.dynamic]
version = { attr = "askround.__version__" }

[tool.ruff]
target-version = "py311"
line-length = 100
# .claude/ holds roadkeep's installed hooks, refreshed by `roadkeep install`
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "C4", "B"]

[tool.ruff.lint.isort]
# the package lives in plugin/src (AR38)
known-first-party = ["askround"]

[tool.ruff.lint.per-file-ignores]
# the extraction instructions are prose a model reads: hard line breaks inside one
# instruction would change what it is told
"plugin/src/askround/extract.py" = ["E501"]
"plugin/src/askround/lookup.py" = ["E501"]
"plugin/src/askround/gaps.py" = ["E501"]
"plugin/src/askround/discover.py" = ["E501"]
# tool descriptions are prose an agent reads
"plugin/src/askround/mcp.py" = ["E501"]
"plugin/src/askround/research.py" = ["E501"]
"plugin/src/askround/refusals.py" = ["E501"]
"plugin/src/askround/budget.py" = ["E501"]
"plugin/src/askround/jobs.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugin/src", "tests"]
markers = ["live: calls the real provider APIs; runs only with ASKROUND_LIVE=1"]
